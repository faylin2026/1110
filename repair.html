<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>報修登記</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="top-nav"><a href="index.html">← 台中牛羊肉價格比較</a></nav>
    <h1>報修登記</h1>
    <p class="subtitle">填寫下方表單送出報修，送出後會出現在清單中。</p>
  </header>

  <main>
    <div id="config-warning" class="message message-error" role="alert" hidden></div>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>
      <form id="repair-form" novalidate>
        <div class="field">
          <label for="reporter_name">報修人 <span class="req" aria-hidden="true">*</span></label>
          <input id="reporter_name" name="reporter_name" type="text" maxlength="50" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="location">地點或部門 <span class="req" aria-hidden="true">*</span></label>
          <input id="location" name="location" type="text" maxlength="100" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="category">類別 <span class="req" aria-hidden="true">*</span></label>
            <select id="category" name="category" required>
              <option value="" selected disabled>請選擇</option>
              <option value="設備">設備</option>
              <option value="網路">網路</option>
              <option value="環境">環境</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div class="field">
            <label for="urgency">緊急程度 <span class="req" aria-hidden="true">*</span></label>
            <select id="urgency" name="urgency" required>
              <option value="低">低</option>
              <option value="中" selected>中</option>
              <option value="高">高</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="description">問題說明 <span class="req" aria-hidden="true">*</span></label>
          <textarea id="description" name="description" rows="4" maxlength="1000" required></textarea>
          <p class="hint"><span id="description-count">0</span> / 1000 字</p>
        </div>

        <button id="submit-btn" type="submit">送出報修</button>
        <div id="form-message" class="message" role="status" aria-live="polite" hidden></div>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title">最近 20 筆報修</h2>
        <button id="refresh-btn" type="button" class="secondary">重新整理</button>
      </div>
      <p id="list-status" class="hint" role="status" aria-live="polite">載入中…</p>
      <ul id="repair-list" class="repair-list"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
          integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
          crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
