<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>錦記地瓜酥訂購</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="top-nav"><a href="index.html">← 訂購價格比較</a></nav>
    <h1>錦記地瓜酥訂購登記</h1>
    <p class="subtitle">填寫訂購人、電話、品項與數量後送出。</p>
  </header>

  <main>
    <div id="config-warning" class="message message-error" role="alert" hidden></div>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">訂購資料</h2>
      <form id="jinji-form" novalidate>
        <div class="field">
          <label for="customer_name">訂購人 <span class="req" aria-hidden="true">*</span></label>
          <input id="customer_name" name="customer_name" type="text" maxlength="50" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="phone">電話 <span class="req" aria-hidden="true">*</span></label>
          <input id="phone" name="phone" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="例如 0912-345-678" required>
        </div>

        <div class="field">
          <label for="item_name">品項 <span class="req" aria-hidden="true">*</span></label>
          <select id="item_name" name="item_name" required>
            <option value="" selected disabled>請選擇品項</option>
          </select>
          <p id="item-info" class="hint"></p>
        </div>

        <div class="field">
          <label for="quantity">訂購數量（包） <span class="req" aria-hidden="true">*</span></label>
          <div class="stepper stepper-wide">
            <button id="qty-minus" type="button" class="secondary step-btn" aria-label="減少一包">−</button>
            <input id="quantity" name="quantity" type="number" inputmode="numeric" min="1" max="100" step="1" value="1" required>
            <button id="qty-plus" type="button" class="secondary step-btn" aria-label="增加一包">＋</button>
          </div>
          <p class="hint">1～100 包。</p>
        </div>

        <p class="estimate">預估金額：<strong id="estimate">—</strong></p>

        <button id="submit-btn" type="submit">送出訂購</button>
        <div id="form-message" class="message" role="status" aria-live="polite" hidden></div>
      </form>
    </section>

    <p class="hint footer-note">
      金額為網路參考價（約 100 元一包），實際以店家報價為準；你的姓名與電話不會顯示在網頁上。<br>
      店家：錦記手工地瓜酥・高雄市旗津區中洲里永興巷93之1號・<a href="tel:075715958">07-571-5958</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
          integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
          crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="jinji.js"></script>
</body>
</html>
