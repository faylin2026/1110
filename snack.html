<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>錦記地瓜酥登記表</title>
  <meta name="theme-color" content="#2357c6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="訂購比價">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="top-nav"><a href="index.html">← 訂購價格比較</a></nav>
    <h1>錦記地瓜酥登記表</h1>
    <p class="subtitle">高雄旗津錦記手工地瓜酥。選好每種口味要幾包，填寫聯絡資料後送出。</p>
  </header>

  <main>
    <div id="config-warning" class="message message-error" role="alert" hidden></div>

    <div class="message message-warn" role="note">
      <strong>請注意：</strong>
      每包價格是網路參考價（店面約 100 元一包），實際以店家報價為準；店家在高雄，宅配運費另計。送出後會由專人統一向店家訂購並與你聯絡。你的姓名與電話不會顯示在網頁上。
    </div>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">選擇口味與包數</h2>
      <form id="snack-form" novalidate>
        <ul id="snack-list" class="snack-list"></ul>

        <div class="summary" aria-live="polite">
          <p>合計：<strong id="sum-packs">0</strong> 包・約 <strong id="sum-kg">0</strong> 公斤</p>
          <p class="estimate">預估金額：<strong id="sum-price">0 元</strong></p>
        </div>

        <h2 class="form-section">聯絡資料</h2>

        <div class="field">
          <label for="customer_name">登記人 <span class="req" aria-hidden="true">*</span></label>
          <input id="customer_name" name="customer_name" type="text" maxlength="50" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="phone">電話 <span class="req" aria-hidden="true">*</span></label>
          <input id="phone" name="phone" type="tel" inputmode="tel" maxlength="20" autocomplete="tel" placeholder="例如 0912-345-678" required>
        </div>

        <fieldset class="field radio-group">
          <legend>取貨方式 <span class="req" aria-hidden="true">*</span></legend>
          <label class="radio"><input type="radio" name="pickup_method" value="自取" checked> 自取</label>
          <label class="radio"><input type="radio" name="pickup_method" value="宅配"> 宅配</label>
        </fieldset>

        <div class="field">
          <label id="pickup-note-label" for="pickup_note">希望取貨時間</label>
          <input id="pickup_note" name="pickup_note" type="text" maxlength="200">
          <p id="pickup-note-hint" class="hint">選填，例如：11/20 下午。</p>
        </div>

        <div class="field">
          <label for="note">備註</label>
          <textarea id="note" name="note" rows="3" maxlength="400" placeholder="例如：蜜糖口味、想要條狀"></textarea>
        </div>

        <button id="submit-btn" type="submit">送出登記</button>
        <div id="form-message" class="message" role="status" aria-live="polite" hidden></div>
      </form>
    </section>

    <p class="hint footer-note">店家：錦記手工地瓜酥・高雄市旗津區中洲里永興巷93之1號・<a href="tel:075715958">07-571-5958</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
          integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
          crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="meat-data.js"></script>
  <script src="snack.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
