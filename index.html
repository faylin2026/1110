<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>台中牛羊肉價格比較</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="top-nav"><a href="repair.html">報修登記 →</a></nav>
    <h1>台中牛羊肉價格比較</h1>
    <p class="subtitle">台中市牛肉、羊肉肉舖的品項與每公斤價格。要訂購請直接打電話給店家。</p>
  </header>

  <main>
    <div class="message message-warn" role="note">
      <strong>使用前請注意：</strong>
      價格是網路上找到的參考價，不是即時報價；Google 評分尚未逐一查證（是否達 4 顆星以上請到 Google 地圖確認）。下單前請先向店家確認價格與營業狀況。
      <span class="hint-inline">資料整理日期：<span id="updated"></span></span>
    </div>

    <section class="card" aria-labelledby="items-title">
      <h2 id="items-title">品項與每公斤價格</h2>
      <div class="field-row filters">
        <div class="field">
          <label for="filter-meat">肉類</label>
          <select id="filter-meat">
            <option value="">牛肉＋羊肉</option>
            <option value="牛肉">牛肉</option>
            <option value="羊肉">羊肉</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-store">店家</label>
          <select id="filter-store"><option value="">全部店家</option></select>
        </div>
        <div class="field">
          <label for="filter-origin">肉品來源</label>
          <select id="filter-origin"><option value="">全部來源</option></select>
        </div>
        <div class="field">
          <label for="sort">排序</label>
          <select id="sort">
            <option value="asc" selected>每公斤價格：低 → 高</option>
            <option value="desc">每公斤價格：高 → 低</option>
            <option value="store">依店家</option>
          </select>
        </div>
      </div>
      <p id="items-status" class="hint" role="status" aria-live="polite"></p>
      <ul id="item-list" class="item-list"></ul>
      <p class="hint">每公斤價格 = 售價 ÷ 重量（公斤），四捨五入到整數元；1 台斤 = 0.6 公斤。售價有兩個數字時，表示店家不同頁面標示的價格不一致。</p>
    </section>

    <section class="card" aria-labelledby="stores-title">
      <h2 id="stores-title">店家資料</h2>
      <ul id="store-list" class="store-list"></ul>
    </section>

    <p class="hint footer-note">完整資料與來源連結：<a href="https://github.com/faylin2026/1110/blob/main/%E6%96%87%E4%BB%B6/%E5%8F%B0%E4%B8%AD%E5%B8%82%E7%89%9B%E8%82%89%E9%8A%B7%E5%94%AE%E6%93%9A%E9%BB%9E.md">台中市牛肉銷售據點.md</a>、<a href="https://github.com/faylin2026/1110/blob/main/%E6%96%87%E4%BB%B6/%E5%8F%B0%E4%B8%AD%E5%B8%82%E7%BE%8A%E8%82%89%E9%8A%B7%E5%94%AE%E6%93%9A%E9%BB%9E.md">台中市羊肉銷售據點.md</a></p>
  </main>

  <script src="meat-data.js"></script>
  <script src="meat.js"></script>
</body>
</html>
